name: Generate Time Report and Host on GitHub Pages

on:
  push:
    branches:
      - '**'

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Current Date and Time
        id: datetime
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "time=$(date +'%H:%M:%S %Z')" >> $GITHUB_OUTPUT

      # STEP 1: Create the directory AND the HTML file FIRST
      - name: Create HTML Report
        run: |
          mkdir -p reports
          cat << 'EOF' > reports/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Execution Report</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      background-color: #f4f6f8;
                      margin: 0;
                  }
                  .card {
                      background: white;
                      padding: 2rem;
                      border-radius: 8px;
                      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                      text-align: center;
                  }
                  h1 { color: #2c3e50; }
                  p { font-size: 1.2rem; color: #555; }
                  .highlight { font-weight: bold; color: #0066cc; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>Workflow Execution Status</h1>
                  <p>Hello <span class="highlight">Rafi</span>,</p>
                  <p>The time is <span class="highlight">${{ steps.datetime.outputs.time }}</span> and date is <span class="highlight">${{ steps.datetime.outputs.date }}</span>.</p>
              </div>
          </body>
          </html>
          EOF

      # Verification step to confirm directory existence
      - name: Verify Report Directory
        run: ls -la reports/

      # STEP 2: Configure Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # STEP 3: Upload Pages Artifact (Points to existing 'reports' path)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'reports'

      # STEP 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
